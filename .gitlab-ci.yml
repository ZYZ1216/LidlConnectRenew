stages:
  - run_refill

refill_job:
  stage: run_refill
  image: mcr.microsoft.com/playwright/python:v1.42.0-jammy  # 使用官方预装 Playwright 及浏览器的 Docker 镜像
  script:
    # 安装项目依赖（如果依赖简单也可以直接 pip install playwright）
    - pip install --upgrade pip
    - pip install playwright
    # 运行你的 Python 脚本（假设脚本文件名是 LidlConnect.py）
    - python LidlConnect.py
  only:
    - schedules  # 仅在定时任务触发时运行
    - web        # 允许在 GitLab 网页控制台上手动点击 "Run pipeline" 测试