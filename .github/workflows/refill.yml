name: Lidl Auto Refill

on:
  schedule:
    # Cron 表达式：每小时运行一次（或改为 */30 * * * * 每半小时一次）
    - cron: '0 * * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击测试运行

jobs:
  check-and-refill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Lidl Connect Refill Script
        env:
          LIDL_USER: ${{ secrets.LIDL_USER }}
          LIDL_PASS: ${{ secrets.LIDL_PASS }}
        run: |
          python LidlConnect_2.py